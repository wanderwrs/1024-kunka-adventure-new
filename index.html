<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锟斤拷大冒险：解救 1024</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#04060a; --panel:rgba(13,17,23,.82); --border:rgba(88,214,235,.22);
    --green:#39d353; --cyan:#58d6eb; --yellow:#e3b341; --red:#f85149; --pink:#ff4d9d;
    --text:#c9d1d9; --dim:#7d8590;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Cascadia Code","JetBrains Mono",Consolas,"Microsoft YaHei",monospace;
    -webkit-font-smoothing:antialiased;
  }
  /* ============ 全屏抽象背景 ============ */
  #matrix{position:fixed;inset:0;z-index:0;opacity:.20;pointer-events:none}
  .bg-grid{
    position:fixed;inset:-20% -20% -20% -20%;z-index:1;pointer-events:none;opacity:.28;
    background-image:linear-gradient(rgba(88,214,235,.10) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(88,214,235,.10) 1px,transparent 1px);
    background-size:52px 52px;
    transform:perspective(600px) rotateX(58deg);
    animation:gridmove 9s linear infinite;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 72%);
  }
  @keyframes gridmove{to{background-position:0 52px,52px 0}}
  .bg-glow{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(600px 420px at 12% 0%,rgba(57,211,83,.16),transparent 70%),
      radial-gradient(700px 500px at 92% 8%,rgba(88,214,235,.14),transparent 72%),
      radial-gradient(800px 600px at 50% 108%,rgba(255,77,157,.10),transparent 70%);
    animation:breathe 12s ease-in-out infinite alternate;
  }
  @keyframes breathe{to{opacity:.55;transform:scale(1.08)}}
  .scanlines{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.16;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.55) 2px 4px);
    mix-blend-mode:multiply;
  }
  /* ============ 顶栏 ============ */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:62px;z-index:60;
    display:flex;align-items:center;gap:18px;padding:0 22px;
    background:linear-gradient(180deg,rgba(4,6,10,.94),rgba(4,6,10,.55));
    border-bottom:1px solid rgba(88,214,235,.14);backdrop-filter:blur(10px);
  }
  .brand{font-size:19px;letter-spacing:3px;color:var(--green);white-space:nowrap}
  .brand span{font-size:11px;color:var(--dim);letter-spacing:1px;margin-left:6px}
  .brand .cursorline{display:inline-block;width:9px;height:16px;background:var(--green);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .stats b{color:var(--cyan);font-weight:400}
  .stats .rank b{color:var(--yellow)}
  .top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  /* ============ 布局 ============ */
  .app{
    position:relative;z-index:10;height:100vh;
    display:grid;grid-template-columns:92px minmax(0,1fr) 172px;
    gap:18px;padding:78px 20px 50px;
  }
  .rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
  .rail.left{justify-content:center}
  .lv-node{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  .lv-node .dotbox{
    width:34px;height:34px;border:1px solid rgba(88,214,235,.22);border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    background:rgba(13,17,23,.6);transition:.3s;
  }
  .lv-node.done .dotbox{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(57,211,83,.35)}
  .lv-node.now .dotbox{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px rgba(88,214,235,.5);transform:scale(1.12)}
  .lv-line{width:1px;height:22px;background:linear-gradient(var(--border),transparent)}
  /* 碎片坞 */
  .frag-dock{gap:10px;justify-content:center}
  .dock-title{font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;writing-mode:vertical-rl;text-orientation:mixed}
  .frag-slot{
    width:136px;padding:9px 10px;border-radius:9px;border:1px dashed rgba(88,214,235,.2);
    background:rgba(13,17,23,.55);font-size:12px;color:var(--dim);
    display:flex;align-items:center;gap:8px;transition:.35s;
  }
  .frag-slot .idx{font-size:10px;color:var(--dim);border:1px solid rgba(125,133,144,.4);border-radius:4px;padding:1px 4px}
  .frag-slot.got{border-style:solid;border-color:var(--green);color:var(--green);background:rgba(57,211,83,.08);box-shadow:0 0 16px rgba(57,211,83,.18)}
  .frag-slot.got .idx{border-color:var(--green);color:var(--green)}
  .frag-slot.pulse{animation:slotpulse 1s ease-out}
  @keyframes slotpulse{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 26px rgba(57,211,83,.5)}100%{transform:scale(1)}}
  /* 舞台 */
  .stage{position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(88,214,235,.35) transparent}
  .stage::-webkit-scrollbar{width:6px}
  .stage::-webkit-scrollbar-thumb{background:rgba(88,214,235,.3);border-radius:3px}
  .panel{
    position:relative;min-height:100%;padding:clamp(26px,4vw,54px);
    background:linear-gradient(155deg,rgba(13,17,23,.86),rgba(5,8,12,.92));
    border:1px solid var(--border);border-radius:20px;
    box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(14px);overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(500px 260px at 100% 0%,rgba(88,214,235,.10),transparent 70%);
  }
  .watermark{
    position:absolute;right:10px;bottom:-30px;font-size:clamp(120px,20vw,260px);
    font-weight:800;color:rgba(88,214,235,.05);line-height:.8;pointer-events:none;letter-spacing:-10px;
  }
  /* ============ 通用元素 ============ */
  .kicker{font-size:11px;letter-spacing:4px;color:var(--cyan);text-transform:uppercase}
  h1.hero{
    position:relative;font-size:clamp(32px,6.4vw,72px);line-height:1.06;letter-spacing:2px;
    color:#eafff0;margin:14px 0 6px;text-shadow:0 0 26px rgba(57,211,83,.45);
  }
  h1.hero .stroke{-webkit-text-stroke:1px var(--green);color:transparent;text-shadow:none}
  .hero-glitch{position:relative;display:inline-block}
  .hero-glitch::before,.hero-glitch::after{
    content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;pointer-events:none;
  }
  .hero-glitch::before{color:var(--cyan);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl1 4s infinite}
  .hero-glitch::after{color:var(--pink);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 4s infinite}
  @keyframes gl1{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-4px,-2px);opacity:.9}93%{transform:translate(3px,1px);opacity:.7}}
  @keyframes gl2{0%,86%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(4px,2px);opacity:.85}92%{transform:translate(-3px,-1px);opacity:.6}}
  .lead{color:var(--text);font-size:15px;line-height:2;max-width:74ch}
  .lead .bad{color:var(--red)}
  .lead .hl{color:var(--yellow)}
  .muted{color:var(--dim);font-size:12px;line-height:1.9}
  .btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:rgba(57,211,83,.06);border:1px solid rgba(57,211,83,.55);color:var(--green);
    font:inherit;font-size:14px;padding:12px 28px;border-radius:10px;cursor:pointer;
    letter-spacing:1px;transition:.18s;overflow:hidden;
  }
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(57,211,83,.28),transparent 70%);transform:translateX(-120%);transition:.5s}
  .btn:hover{background:rgba(57,211,83,.16);box-shadow:0 0 26px rgba(57,211,83,.35),inset 0 0 20px rgba(57,211,83,.08)}
  .btn:hover::after{transform:translateX(120%)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
  .btn.small{padding:8px 16px;font-size:12px}
  .btn.ghost{border-color:rgba(88,214,235,.45);color:var(--cyan);background:rgba(88,214,235,.05)}
  .btn.ghost:hover{background:rgba(88,214,235,.14);box-shadow:0 0 22px rgba(88,214,235,.3)}
  .btn.warn{border-color:rgba(227,179,65,.5);color:var(--yellow);background:rgba(227,179,65,.05)}
  .btn.warn:hover{background:rgba(227,179,65,.14);box-shadow:0 0 22px rgba(227,179,65,.28)}
  input[type=text]{
    background:rgba(4,6,10,.85);border:1px solid rgba(88,214,235,.3);color:var(--green);
    font:inherit;font-size:15px;padding:12px 15px;border-radius:10px;outline:none;
    width:100%;max-width:400px;transition:.2s;letter-spacing:1px;
  }
  input[type=text]::placeholder{color:rgba(125,133,144,.7);font-size:13px}
  input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(88,214,235,.12),0 0 24px rgba(88,214,235,.18)}
  input[type=text].wrong{animation:shake .3s;border-color:var(--red)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
  /* 题目 */
  .qhead{display:flex;align-items:center;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
  .qindex{
    font-size:11px;color:var(--cyan);border:1px solid rgba(88,214,235,.35);
    padding:3px 9px;border-radius:20px;letter-spacing:1px;
  }
  .qtext{font-size:clamp(16px,2vw,20px);line-height:1.7;color:#e6edf3;max-width:70ch}
  .mono-block{
    position:relative;margin:16px 0;padding:18px 20px;border-radius:12px;
    background:rgba(0,0,0,.55);border:1px solid rgba(227,179,65,.28);
    color:var(--yellow);font-size:clamp(18px,2.6vw,26px);letter-spacing:4px;
    word-break:break-all;box-shadow:inset 0 0 40px rgba(227,179,65,.05);
  }
  .mono-block .tiny{font-size:11px;letter-spacing:1px;color:var(--dim);display:block;margin-bottom:8px}
  .mono-block.b64{color:var(--cyan);border-color:rgba(88,214,235,.28);font-size:clamp(15px,2vw,20px)}
  .opts{display:grid;gap:10px;margin:16px 0;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .opt{
    position:relative;text-align:left;background:rgba(4,6,10,.7);border:1px solid rgba(88,214,235,.18);
    color:var(--text);font:inherit;font-size:14px;padding:14px 16px 14px 48px;border-radius:10px;
    cursor:pointer;transition:.15s;line-height:1.5;
  }
  .opt .key{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border:1px solid rgba(88,214,235,.3);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--cyan);
  }
  .opt:hover{border-color:var(--cyan);background:rgba(88,214,235,.08);transform:translateX(3px)}
  .opt.right{border-color:var(--green);background:rgba(57,211,83,.12);color:var(--green)}
  .opt.right .key{border-color:var(--green);color:var(--green)}
  .opt.wrong{border-color:var(--red);color:var(--red);animation:shake .3s}
  .opt.wrong .key{border-color:var(--red);color:var(--red)}
  .feedback{min-height:22px;margin:10px 0;font-size:13px;letter-spacing:.5px}
  .feedback.ok{color:var(--green)}
  .feedback.bad{color:var(--red)}
  .knowledge{
    margin:14px 0;padding:14px 16px;border-left:2px solid var(--cyan);border-radius:0 10px 10px 0;
    background:linear-gradient(90deg,rgba(88,214,235,.10),rgba(88,214,235,.02));
    font-size:13px;line-height:1.9;color:var(--text);
  }
  .knowledge b{color:var(--cyan);font-weight:400}
  .tip{font-size:11px;color:var(--dim);line-height:1.8;margin-top:10px}
  .tip b{color:var(--yellow);font-weight:400}
  /* 进度条 */
  .prog{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:6px 0 18px;max-width:520px}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .6s}
  /* 碎片浮标 */
  .frag-glyph{
    position:fixed;z-index:70;width:58px;height:58px;border-radius:50%;
    border:1px solid rgba(57,211,83,.65);background:radial-gradient(circle,rgba(57,211,83,.22),rgba(4,6,10,.9));
    color:var(--green);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 26px rgba(57,211,83,.55);animation:glyphfloat 4s ease-in-out infinite;
  }
  .frag-glyph::after{
    content:"FRAG";position:absolute;bottom:-18px;font-size:8px;letter-spacing:2px;color:var(--cyan);
  }
  @keyframes glyphfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  .frag-glyph:hover{transform:scale(1.15);box-shadow:0 0 40px rgba(57,211,83,.8)}
  /* 吐司 */
  .toast-wrap{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:9500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{
    padding:10px 20px;border-radius:20px;font-size:13px;letter-spacing:1px;
    background:rgba(57,211,83,.12);border:1px solid var(--green);color:var(--green);
    box-shadow:0 0 30px rgba(57,211,83,.3);animation:toastin .3s ease-out;
  }
  .toast.bad{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.12);box-shadow:0 0 30px rgba(248,81,73,.3)}
  @keyframes toastin{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
  /* ============ 底栏 ============ */
  .ticker{
    position:fixed;bottom:0;left:0;right:0;height:34px;z-index:60;
    display:flex;align-items:center;gap:10px;padding:0 16px;overflow:hidden;
    background:rgba(4,6,10,.92);border-top:1px solid rgba(88,214,235,.14);
    font-size:11px;color:rgba(125,133,144,.9);letter-spacing:.5px;
  }
  .ticker .dotled{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s steps(1) infinite;flex:none}
  .ticker span{white-space:nowrap;animation:tickermove 30s linear infinite}
  @keyframes tickermove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  /* ============ 结局 ============ */
  .blessing{
    font-size:clamp(19px,3.4vw,34px);line-height:1.9;letter-spacing:3px;color:var(--green);
    text-shadow:0 0 30px rgba(57,211,83,.55);text-align:center;margin:26px 0;
  }
  .rank-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:22px 0}
  .rank-card{border:1px solid rgba(88,214,235,.2);border-radius:12px;padding:16px;text-align:center;background:rgba(4,6,10,.6)}
  .rank-card .lab{font-size:11px;color:var(--dim);letter-spacing:2px}
  .rank-card .val{font-size:30px;color:var(--yellow);margin-top:6px;text-shadow:0 0 18px rgba(227,179,65,.4)}
  table.lb{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
  table.lb th,table.lb td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(88,214,235,.12)}
  table.lb th{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:1px}
  table.lb tr.me{color:var(--green)}
  #confetti{position:fixed;inset:0;z-index:9800;pointer-events:none}
  /* ============ 混乱动画 ============ */
  #chaos{position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden}
  .chaos-dim{position:fixed;inset:0;background:rgba(0,0,0,.55);pointer-events:auto;animation:fadein .2s}
  @keyframes fadein{from{opacity:0}}
  #app{transition:filter .25s,transform .25s}
  #app.frozen{filter:grayscale(1) blur(1.4px) contrast(.8);transform:scale(.995);pointer-events:none}
  .freeze-dialog{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,88vw);
    background:#161b22;border:1px solid rgba(88,214,235,.4);border-radius:12px;padding:22px;
    pointer-events:auto;box-shadow:0 30px 80px rgba(0,0,0,.8);z-index:9100;text-align:center;
  }
  .freeze-dialog .spin{
    width:26px;height:26px;border:2px solid rgba(88,214,235,.2);border-top-color:var(--cyan);
    border-radius:50%;margin:12px auto;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .bsod{
    position:fixed;inset:0;background:#0a6ed1;color:#fff;z-index:9200;pointer-events:auto;
    padding:clamp(24px,8vw,120px);font-family:"Cascadia Code",Consolas,monospace;display:flex;flex-direction:column;justify-content:center;
  }
  .bsod .face{font-size:clamp(60px,12vw,120px);line-height:1;margin-bottom:18px}
  .bsod h2{font-size:clamp(20px,3vw,34px);font-weight:400;margin-bottom:18px;line-height:1.4}
  .bsod p{font-size:13px;line-height:2;opacity:.94;max-width:80ch}
  .bsod .qr{width:86px;height:86px;background:
    repeating-conic-gradient(#fff 0 25%,#0a6ed1 0 50%) 0 0/12px 12px;
    margin:20px 0;border:6px solid #fff}
  .bsod .pct{font-size:15px;margin-top:12px}
  .kernel{
    position:fixed;inset:0;background:#000;color:#9be39b;z-index:9200;pointer-events:auto;
    padding:22px;font-size:12px;line-height:1.9;overflow:hidden;white-space:pre-wrap;
  }
  .kernel .bar{position:absolute;bottom:0;left:0;right:0;height:26px;background:#111;color:#666;display:flex;align-items:center;padding:0 12px;font-size:11px}
  .virus-popup{
    position:fixed;width:min(360px,86vw);z-index:9300;pointer-events:auto;
    background:#c0c0c0;color:#111;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;
    box-shadow:6px 6px 0 rgba(0,0,0,.45);font-family:"Microsoft YaHei","MS Sans Serif",sans-serif;font-size:13px;
    animation:popin .16s ease-out;
  }
  @keyframes popin{from{transform:scale(.85);opacity:0}}
  .virus-popup .vp-title{
    display:flex;align-items:center;justify-content:space-between;padding:4px 6px;
    background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:12px;font-weight:600;
  }
  .virus-popup .vp-x{
    width:18px;height:16px;background:#c0c0c0;border:1px solid #fff;border-right-color:#404040;border-bottom-color:#404040;
    color:#111;font-size:10px;cursor:pointer;line-height:1;
  }
  .virus-popup .vp-body{padding:18px 16px;display:flex;gap:12px;align-items:flex-start;line-height:1.7}
  .virus-popup .vp-icon{font-size:28px;line-height:1}
  .virus-popup .vp-actions{display:flex;gap:8px;justify-content:center;padding:0 14px 14px}
  .virus-popup .vp-actions button{
    min-width:76px;padding:5px 12px;background:#c0c0c0;border:2px solid #fff;
    border-right-color:#404040;border-bottom-color:#404040;font:inherit;font-size:12px;cursor:pointer;color:#111;
  }
  .virus-popup .vp-actions button:active{border-color:#404040 #fff #fff #404040}
  .av-win{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,92vw);
    background:#0b1014;border:1px solid rgba(57,211,83,.5);border-radius:12px;padding:18px 20px;
    z-index:9350;pointer-events:auto;box-shadow:0 30px 90px rgba(0,0,0,.85),0 0 40px rgba(57,211,83,.15);
    animation:popin .18s ease-out;
  }
  .av-win .av-title{display:flex;align-items:center;justify-content:space-between;color:var(--green);font-size:13px;letter-spacing:1px}
  .av-win .av-bar{height:10px;background:#05070a;border:1px solid rgba(57,211,83,.25);border-radius:6px;overflow:hidden;margin:14px 0}
  .av-win .av-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .35s}
  .av-win .av-log{font-size:12px;color:var(--dim);line-height:1.9;min-height:48px;letter-spacing:.5px}
  /* 弹窗广告 */
  .ad-popup{
    position:fixed;width:min(400px,90vw);z-index:9300;pointer-events:auto;
    background:linear-gradient(160deg,#1c1030,#30124a);color:#ffd76a;
    border:2px solid #ff4d9d;border-radius:10px;
    box-shadow:0 0 0 3px rgba(255,77,157,.25),0 24px 70px rgba(0,0,0,.8),0 0 34px rgba(255,77,157,.35);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    animation:adShake .5s ease-out, adGlow 1.4s ease-in-out .5s infinite alternate;
  }

  @keyframes adGlow{from{box-shadow:0 0 0 3px rgba(255,77,157,.25),0 24px 70px rgba(0,0,0,.8),0 0 20px rgba(255,77,157,.3)}

  .ad-tag{
    position:absolute;top:-12px;left:14px;background:#f85149;color:#fff;font-size:11px;
    padding:2px 8px;border-radius:3px;letter-spacing:2px;transform:rotate(-3deg);
  }
  .ad-realx{
    position:absolute;top:-11px;right:-11px;width:24px;height:24px;border-radius:50%;
    background:#222;color:#aaa;border:1px solid #666;font-size:13px;line-height:1;cursor:pointer;
    font-family:monospace;z-index:2;

  .ad-realx:hover{background:#f85149;color:#fff}
  .ad-body{padding:26px 20px 16px;text-align:center;line-height:1.8}
  .ad-head{font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 0 12px rgba(255,77,157,.8)}
  .ad-sub{font-size:13px;color:#ffb3d9;margin-top:6px}
  .ad-prize{
    margin:14px auto 4px;display:inline-block;font-size:26px;font-weight:900;color:#ffe259;
    text-shadow:0 2px 0 #b8860b,0 0 18px rgba(255,226,89,.6);animation:adPrize .7s ease-in-out infinite alternate;
  }
  @keyframes adPrize{from{transform:scale(1)}to{transform:scale(1.09)}}
  .ad-actions{display:flex;gap:12px;justify-content:center;padding:14px 16px 18px}
  .ad-cta{
    flex:1;padding:9px 0;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;
    background:linear-gradient(180deg,#ffe259,#ffa751);color:#5a2d00;
    box-shadow:0 3px 0 #b8860b;letter-spacing:1px;

  .ad-cta:active{transform:translateY(2px);box-shadow:0 1px 0 #b8860b}
  .ad-fakeclose{

  }
  .ad-fakeclose:hover{background:#4a4a4a}
  .ad-small{font-size:10px;color:rgba(255,255,255,.35);padding:0 0 10px;letter-spacing:.5px}
  /* 鬼脸 */
  .ghost-screen{
    position:fixed;inset:0;z-index:9900;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;pointer-events:auto;overflow:hidden;
    animation:ghostIn .25s steps(3) both;
  }
  @keyframes ghostIn{0%{opacity:0;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
  .ghost-face{
    font-family:"Cascadia Code",Consolas,monospace;font-size:clamp(14px,2.4vw,26px);line-height:1.25;
    color:#ff2d55;text-shadow:0 0 22px rgba(255,45,85,.9),0 0 60px rgba(255,45,85,.5);
    animation:ghostJit .12s steps(2) infinite;user-select:none;margin:0;
  }
  @keyframes ghostJit{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-2px)}}
  .ghost-laugh{
    font-size:clamp(26px,5vw,54px);font-weight:900;color:#ff2d55;letter-spacing:14px;
    text-shadow:0 0 18px rgba(255,45,85,.8);animation:ghostJit .15s steps(2) infinite;
  }
  .ghost-tip{color:#caa;font-size:15px;letter-spacing:2px}
  .ghost-tip2{color:#755;font-size:12px;letter-spacing:1px}
  .mojibake-veil{position:fixed;inset:0;z-index:9400;pointer-events:none;display:flex;align-items:center;justify-content:center;
    color:rgba(57,211,83,.14);font-size:clamp(20px,4vw,44px);letter-spacing:8px;overflow:hidden}
  /* 响应式 */
  @media(max-width:1180px){
    .app{grid-template-columns:minmax(0,1fr);padding:72px 12px 42px}
    .rail{display:none}
  }
  @media(max-width:640px){
    .stats .hide-s{display:none}
    .brand span{display:none}
    .opts{grid-template-columns:1fr}

  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanlines"></div>

<header class="topbar">
  <div class="brand">KU&#x014A;KA<span>//1024</span><i class="cursorline"></i></div>
  <div class="stats">
    <span>侦探 <b id="s-name">--</b></span>
    <span class="hide-s">用时 <b id="s-time">00:00</b></span>
    <span>碎片 <b id="s-frag">0/6</b></span>
    <span class="rank">预计排名 <b id="s-rank">--</b></span>
  </div>
  <div class="top-right">
    <button class="btn ghost small" id="radar-btn">碎片雷达</button>
    <button class="btn ghost small" id="decode-btn">解码器</button>
  </div>
</header>

<div class="app" id="app">
  <nav class="rail left" id="rail"></nav>
  <main class="stage"><section class="panel" id="screen"></section></main>
  <aside class="rail frag-dock" id="dock"></aside>
</div>

<footer class="ticker">
  <i class="dotled"></i>
  <span id="ticker-text"></span>
</footer>

<div id="chaos"></div>
<div class="toast-wrap" id="toast-wrap"></div>
<canvas id="confetti"></canvas>

<!-- ============================================================
     碎片信号 FRAG-2 (Base64 / UTF-8)：6Lqr5L2T5YGl5bq377yM
     ============================================================ -->
<div id="frag-4-vault" style="display:none">，钱有里兜</div>
<div id="ascii-vault" style="display:none">
  ASCII-VAULT :: 0x31=49='1', 0x30=48='0', 0x32=50='2', 0x34=52='4',
  0x54=84='T', 0x52=82='R', 0x41=65='A', 0x45=69='E'
</div>
<!-- FRAG-6 的明文藏在样式表规则里：Inspector → Styles → #ghost-frag-6::after -->

<style>
  /* 乱码病毒留下的残余规则，别急着删 */
  #ghost-frag-6::after{content:"节日快乐！"}
</style>
<div id="ghost-frag-6" style="display:none"></div>

<script>
"use strict";
/* ============================================================
   基础工具
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const canon = s => String(s || "").replace(/\s+/g, "").replace(/，/g, ",").replace(/！/g, "!").toLowerCase();
const b64 = s => btoa(unescape(encodeURIComponent(s)));

const FRAGMENTS = ["祝大家", "身体健康，", "开开心心，", "兜里有钱，", "不再加班，", "节日快乐！"];
const HINTS = [
  "第 1 关：答对第一题后，屏幕上会飘过一个发光的汉字，点它。",
  "第 2 关：右键「查看网页源代码」，搜索 FRAG-2，它是一段 Base64。",
  "第 3 关：F12 → Console，日志里有一串十六进制码点（5F00 这种）。",
  "第 4 关：F12 → Elements，找到 id 为 frag-4-vault 的隐藏元素，内容被倒着写。",
  "第 5 关：F12 → Application → Local Storage，键名 kun_frag_5，值是一段 Base64。",
  "第 6 关：F12 → Elements → Styles，查看 #ghost-frag-6 的 ::after 规则。"
];

/* ============================================================
   状态
   ============================================================ */
const SAVE_KEY = "kun_save_v2";
const BOARD_KEY = "kun_board_v2";
let state = null;
let clockId = null;

const freshState = name => ({
  name, level: 0, fragments: new Array(6).fill(null),
  startTime: Date.now(), elapsedBefore: 0
});
function elapsed() {
  if (!state) return 0;
  return Math.floor(state.elapsedBefore + (Date.now() - state.startTime) / 1000);
}
function save() {
  if (!state) return;
  state.elapsedBefore = elapsed();
  state.startTime = Date.now(); // 重置起点，避免重复累计
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.fragments) && s.level >= 0 && s.level <= 6) return s;
  } catch (e) { /* 存档损坏，静默重来 */ }
  return null;
}
function startClock() {
  clearInterval(clockId);
  if (!state) return;
  state.startTime = Date.now();
  clockId = setInterval(refreshHud, 1000);
}
function refreshHud() {
  if (!state) return;
  const n = state.fragments.filter(Boolean).length;
  $("#s-name").textContent = state.name;
  $("#s-time").textContent = fmt(elapsed());
  $("#s-frag").textContent = `${n}/6`;
  $("#s-rank").textContent = `#${previewRank(elapsed())}`;
  renderRail();
  renderDock();
}
function previewRank(t) {
  // 模拟全服：进度越满、耗时越短排名越前（上限 1024）
  const done = state.fragments.filter(Boolean).length;
  const base = 1024 - done * 150;
  const speedBonus = Math.max(0, Math.floor((900 - t) / 900 * 120));
  return Math.max(1, Math.min(1024, base - speedBonus));
}
function renderRail() {
  const rail = $("#rail");
  if (!rail || !state) return;
  rail.innerHTML = Array.from({ length: 6 }, (_, i) => {
    const done = !!state.fragments[i];
    const now = state.level === i;
    return `<div class="lv-node ${done ? "done" : ""} ${now ? "now" : ""}">
      <div class="dotbox">${done ? "✓" : String(i + 1).padStart(2, "0")}</div>
    </div>${i < 5 ? '<div class="lv-line"></div>' : ""}`;
  }).join("");
}
function renderDock() {
  const dock = $("#dock");
  if (!dock || !state) return;
  dock.innerHTML = `<div class="dock-title">FRAGMENTS</div>` +
    FRAGMENTS.map((f, i) => `<div class="frag-slot ${state.fragments[i] ? "got" : ""}">
      <span class="idx">${String(i + 1).padStart(2, "0")}</span>
      <span>${state.fragments[i] ? esc(f) : "???"}</span>
    </div>`).join("");
}

/* 吐司 */
function toast(msg, bad) {
  const w = $("#toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ============================================================
   碎片回收
   ============================================================ */
function claimFragment(text) {
  const i = FRAGMENTS.findIndex((f, idx) => !state.fragments[idx] && canon(f) === canon(text));
  if (i < 0) return -1;
  state.fragments[i] = FRAGMENTS[i];
  save();
  refreshHud();
  const slot = $$(".frag-slot")[i];
  if (slot) { slot.classList.add("pulse"); setTimeout(() => slot.classList.remove("pulse"), 1100); }
  toast(`碎片 #${i + 1} 已回收：${FRAGMENTS[i]}`);
  return i;
}
function spawnGlyph(char, fragIndex) {
  if (state.fragments[fragIndex]) return;
  const g = document.createElement("button");
  g.className = "frag-glyph";
  g.textContent = char;
  g.style.left = rand(30, Math.max(40, innerWidth - 110)) + "px";
  g.style.top = rand(150, Math.max(180, innerHeight - 180)) + "px";
  g.onclick = () => {
    claimFragment(FRAGMENTS[fragIndex]);
    g.remove();
  };
  document.body.appendChild(g);
}

/* ============================================================
   关卡框架
   ============================================================ */
function panel(inner, level) {
  $("#screen").innerHTML = inner + `<div class="watermark">${String(level + 1).padStart(2, "0")}</div>`;
  $("#screen").scrollTop = 0;
}
function levelHeader(n, name, desc) {
  const done = state.fragments.filter(Boolean).length;
  return `
    <div class="kicker">LEVEL ${String(n).padStart(2, "0")} / 06 · ${name}</div>
    <h1 class="hero" style="font-size:clamp(26px,4.6vw,52px)"><span class="hero-glitch" data-t="${desc}">${desc}</span></h1>
    <div class="prog"><i style="width:${done / 6 * 100}%"></i></div>`;
}
function fragBar() {
  return `<div class="tip" style="margin-top:22px">碎片信号：${
    FRAGMENTS.map((f, i) => state.fragments[i]
      ? `<b style="color:var(--green)">[${i + 1}]${esc(f)}</b>`
      : `<span style="color:rgba(125,133,144,.8)">[${i + 1}]</span>`).join(" ")
  }</div>`;
}

/* 关卡收尾：碎片未回收则不能前进 */
function levelComplete(idx, nextFn) {
  const got = !!state.fragments[idx];
  panel(`
    ${levelHeader(idx + 1, "SECTION CLEARED", "本关编码已修复")}
    <div class="lead" style="margin-top:20px">
      ${got
        ? `碎片 <span class="hl">#${idx + 1}「${esc(FRAGMENTS[idx])}」</span> 已经在你手上，前路重新通畅。`
        : `但是……这一关的字符碎片<span class="bad">还游离在外面</span>。不回收它，解码核心无法启动。`}
    </div>
    ${got ? "" : `
      <div class="knowledge"><b>信号定位：</b>${HINTS[idx]}</div>
      <div class="row">
        <input type="text" id="frag-input" placeholder="输入你解码出的碎片文本">
        <button class="btn small" id="frag-claim">回收碎片</button>
      </div>
      <div class="feedback" id="frag-fb"></div>`}
    <div class="row">
      <button class="btn" id="next-btn" ${got ? "" : "disabled"}>进入下一关 →</button>
      <button class="btn ghost small" id="radar-btn2">打开碎片雷达</button>
    </div>
    ${fragBar()}
  `, idx);
  const claim = () => {
    const v = $("#frag-input").value;
    const r = claimFragment(v);
    const fb = $("#frag-fb");
    if (r === idx) {
      fb.className = "feedback ok"; fb.textContent = "信号锁定，碎片已回收。";
      setTimeout(() => levelComplete(idx, nextFn), 700);
    } else {
      fb.className = "feedback bad"; fb.textContent = "解码结果不匹配，或这块碎片已经回收过了。";
    }
  };
  if (!got) {
    $("#frag-claim").onclick = claim;
    $("#frag-input").onkeydown = e => { if (e.key === "Enter") claim(); };
  }
  $("#next-btn").onclick = () => {
    state.level = idx + 1;
    save();
    clearGlyphs();
    nextFn();
  };
  $("#radar-btn2").onclick = openRadar;
}
function clearGlyphs() { $$(".frag-glyph").forEach(g => g.remove()); }

/* ============================================================
   第 1 关：乱码收容所
   ============================================================ */
function level1() {
  const qs = [
    { m: "娴嬭瘯鏂囨湰", a: "测试文本", why: "「测试文本」的 UTF-8 字节被 GBK 解读，一个汉字 3 字节挤进 2 字节的格子，就成了这样。" },
    { m: "浣犲ソ", a: "你好", why: "「你好」的 UTF-8 字节被按 GBK 读取。乱码不是加密，它只是被念错了。" },
    { m: "绋嬪簭", a: "程序", why: "「程序」经 UTF-8 → GBK 误读后的经典产物。看到它，DNA 会动一下。" }
  ];
  let i = 0;
  const draw = () => {
    const q = qs[i];
    panel(`
      ${levelHeader(1, "MOJIBAKE SHELTER", "乱码收容所")}
      <div class="qhead"><span class="qindex">第 ${i + 1} / 3 段</span><span class="muted">这段乱码原本是什么？</span></div>
      <div class="mono-block"><span class="tiny">raw bytes decoded as GBK</span>${esc(q.m)}</div>
      <div class="row">
        <input type="text" id="ans" placeholder="输入原文（不带标点）" autocomplete="off">
        <button class="btn small" id="ok">修复编码</button>
        <button class="btn warn small" id="hint">提示</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="knowledge" id="know" style="display:none"></div>
      <div class="tip">乱码世界里，有些字符会自己掉出来。<b>多看一眼屏幕四周。</b></div>
      ${fragBar()}
    `, 0);
    $("#ans").focus();
    const submit = () => {
      if (canon($("#ans").value) === canon(q.a)) {
        $("#fb").className = "feedback ok"; $("#fb").textContent = "修复成功，乱码散去。";
        const k = $("#know"); k.style.display = "block";
        k.innerHTML = `<b>出生证明：</b>${q.why}`;
        if (i === 0) spawnGlyph("祝", 0);
        setTimeout(() => {
          i++;
          if (i < qs.length) draw();
          else levelComplete(0, level2);
        }, 1800);
      } else {
        $("#fb").className = "feedback bad"; $("#fb").textContent = "不对，它还在嘲笑你。";
        $("#ans").classList.add("wrong");
        setTimeout(() => $("#ans").classList.remove("wrong"), 350);
      }
    };
    $("#ok").onclick = submit;
    $("#ans").onkeydown = e => { if (e.key === "Enter") submit(); };
    $("#hint").onclick = () => {
      $("#fb").className = "feedback";
      $("#fb").textContent = "这是 UTF-8 字节被 GBK 误读的产物，原文是日常最常见的四个字或两个字。";
    };
  };
  draw();
}

/* ============================================================
   第 2 关：二进制密道
   ============================================================ */
function level2() {
  const qs = [
    { b: "0000 0100 0000 0000", o: ["512", "1024", "2048", "4096"], r: 1, why: "2^10 = 1024。程序员节就是从这个数字来的。" },
    { b: "1111 1111", o: ["128", "255", "256", "512"], r: 1, why: "8 个 1 = 2^8 − 1 = 255，一个字节能表示的最大无符号整数。" },
    { b: "0000 0011 1111 0101", o: ["1000", "1010", "1020", "以上都不是"], r: 3, why: "它等于 1013（512+256+128+64+32+16+4+1）。页面上没有这个选项——答案在源码注释里。你翻过源代码了，对吧？" }
  ];
  let i = 0;
  const draw = () => {
    const q = qs[i];
    panel(`
      ${levelHeader(2, "BINARY CORRIDOR", "二进制密道")}
      <div class="qhead"><span class="qindex">第 ${i + 1} / 3 题</span><span class="muted">这串二进制等于十进制的多少？</span></div>
      <div class="mono-block"><span class="tiny">base-2 stream</span>${esc(q.b)}</div>
      <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="key">${String.fromCharCode(65 + k)}</span>${esc(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <div class="knowledge" id="know" style="display:none"></div>
      <div class="tip">${i === 2 ? "这题有点怪。真正的侦探会右键 → <b>查看网页源代码</b>。" : ""}</div>
      ${fragBar()}
    `, 1);
    $$(".opt").forEach(btn => btn.onclick = () => {
      const k = Number(btn.dataset.k);
      if (k === q.r) {
        btn.classList.add("right");
        $("#fb").className = "feedback ok"; $("#fb").textContent = "正确。";
        const kn = $("#know"); kn.style.display = "block"; kn.innerHTML = `<b>进制课堂：</b>${q.why}`;
        setTimeout(() => {
          i++;
          i < qs.length ? draw() : levelComplete(1, level3);
        }, 1900);
      } else {
        btn.classList.add("wrong");
        $("#fb").className = "feedback bad"; $("#fb").textContent = "不对，再算一遍每一位的权值。";
        setTimeout(() => btn.classList.remove("wrong"), 350);
      }
    });
  };
  draw();
}

/* ============================================================
   第 3 关：知识防火墙
   ============================================================ */
function level3() {
  scheduleLevelChaos(2, "virus", 2200);
  const qs = [
    { q: "世界上第一个计算机「bug」是什么？", o: ["一行写错的代码", "一只飞蛾", "一根烧断的电线", "一杯打翻的咖啡"], r: 1, why: "1947 年，Grace Hopper 的团队在 Harvard Mark II 里发现一只飞蛾，把它贴进了日志。" },
    { q: "「图灵测试」用来判断什么？", o: ["CPU 跑分是否达标", "机器能否表现出与人难以区分的智能", "网络延迟是否稳定", "代码有没有注释"], r: 1, why: "图灵在 1950 年提出：评判者无法分辨对话方是人还是机器，机器就算通过。" },
    { q: "1 KB 等于多少字节？", o: ["1000", "1001", "1024", "2048"], r: 2, why: "2^10 = 1024。二进制世界的「整数」。" },
    { q: "AI 的三要素是什么？", o: ["数据、算法、算力", "数据、网络、电力", "模型、显卡、电费", "输入、处理、输出"], r: 0, why: "数据喂饱模型，算法决定上限，算力撑住训练。" },
    { q: "Git 最初是谁动手写出来的？", o: ["Guido van Rossum", "Linus Torvalds", "Dennis Ritchie", "Brendan Eich"], r: 1, why: "2005 年，Linus 与 BitKeeper 闹掰后，自己动手写了 Git 的雏形。" }
  ];
  let i = 0;
  const draw = () => {
    const q = qs[i];
    panel(`

function seeded(seed) { let t = seed; return () => { t = (t * 9301 + 49297) % 233280; return t / 233280; }; }
const GLOBAL = (() => {
  const rnd = seeded(1024), arr = [];
  for (let i = 1; i <= 1023; i++) {
    arr.push({ name: `码农_${String(i).padStart(4, "0")}`, time: Math.floor(150 + rnd() * rnd() * 1200), bot: true });
  }
  return arr;
})();
function localBoard() {
  try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; } catch (e) { return []; }
}
function submitScore(name, time) {
  // 接真实后端时，把这里换成 fetch POST，保留返回排名即可
  const board = localBoard();
  board.push({ name, time, date: Date.now() });
  board.sort((a, b) => a.time - b.time);
  localStorage.setItem(BOARD_KEY, JSON.stringify(board.slice(0, 1024)));
  const all = [...GLOBAL, { name, time, me: true }].sort((a, b) => a.time - b.time);
  return all.findIndex(e => e.me) + 1;
}

/* ============================================================
   混乱动画模块
   ============================================================ */
const chaosLayer = $("#chaos");
const Chaos = {
  busy: false,
  timer: null,
  start() {
    clearTimeout(this.timer);
    this.schedule();
  },
  schedule() {
    // 关卡越靠后，故障越密集
    const lv = state ? state.level : 0;
    const ranges = [
      [15000, 26000], [13000, 22000], [10000, 17000],
      [8500, 14000], [7000, 12000], [5500, 9500]
    ];
    const [a, b] = ranges[Math.min(lv, 5)];
    this.timer = setTimeout(() => {
      if (!document.hidden) this.fire();
      this.schedule();
    }, rand(a, b));

        return NodeFilter.FILTER_ACCEPT;

    if (!nodes.length) return;

(function matrixRain() {
  const cv = $("#matrix"), ctx = cv.getContext("2d");
  let cols, drops, size = 16;
  const chars = "01锟斤拷烫1024ABCDEF".split("");
  function resize() {
    cv.width = innerWidth; cv.height = innerHeight;
    cols = Math.ceil(cv.width / size);
    drops = new Array(cols).fill(0).map(() => rand(0, Math.floor(cv.height / size)));
  }
  resize();
  addEventListener("resize", resize);
  setInterval(() => {
    ctx.fillStyle = "rgba(4,6,10,.12)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = `${size}px "Cascadia Code",Consolas,monospace`;
    for (let i = 0; i < cols; i++) {
      const ch = chars[rand(0, chars.length - 1)];
      const y = drops[i] * size;
      ctx.fillStyle = Math.random() > .96 ? "#58d6eb" : "#39d353";
      ctx.fillText(ch, i * size, y);
      if (y > cv.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }, 70);
})();

/* ============================================================
   彩带
   ============================================================ */
function confetti() {
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#39d353", "#58d6eb", "#e3b341", "#f85149", "#ff4d9d"];
  const ps = Array.from({ length: 180 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    w: 5 + Math.random() * 7, h: 8 + Math.random() * 10,
    vy: 2 + Math.random() * 4, vx: -1.2 + Math.random() * 2.4,
    c: colors[rand(0, colors.length - 1)], r: Math.random() * Math.PI, vr: -.1 + Math.random() * .2
  }));
  let frames = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (++frames < 520) requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}
